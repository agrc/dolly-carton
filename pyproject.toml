[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dolly-carton"
version = "1.0.10"
description = "Project description."
readme = "README.md"
license = "MIT"
authors = [{ name = "UGRC", email = "ugrc-developers@utah.gov" }]
keywords = ["gis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Utilities",
]
dependencies = [
    "arcgis==2.4.2",
    "google-cloud-firestore==2.*",
    "google-cloud-logging==3.*",
    "humanize==4.*",
    "pyodbc==5.*",
    "python-dotenv==1.*",
    "requests==2.*",
    "ugrc-supervisor==3.*",
    "typer==0.*",
]

[project.urls]
Homepage = "https://github.com/agrc/dolly-carton"
"Issue Tracker" = "https://github.com/agrc/dolly-carton/issues"

[project.optional-dependencies]
tests = [
    "pytest-cov>=6,<8",
    "pytest-instafail==0.5.*",
    "pytest-mock==3.*",
    "pytest-watch==4.*",
    "pytest>=8,<10",
    "ruff==0.*",
]

[project.scripts]
dolly = "dolly.main:cli"
dolly-cleanup-dev-agol = "dolly.main:cleanup_dev_agol_items"

[tool.hatch.build.targets.wheel]
packages = ["src/dolly"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
norecursedirs = [".env", "data", "maps", ".github", ".vscode"]
console_output_style = "count"
addopts = "--cov-branch --cov=dolly --cov-report term --cov-report xml:cov.xml --instafail"
markers = [
    "real_backoff: run retry tests with real backoff timing (disables DOLLY_FAST_RETRY)",
]

[tool.coverage.run]
source = ["src/dolly"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.xml]
output = "cov.xml"
